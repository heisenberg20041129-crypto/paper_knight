<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>战斗调试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&amp;family=IM+Fell+English&amp;family=Cinzel:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F0EBE0;--surface:#FCF7E8;--parchment:#D4B896;--parchment-dark:#C9A87A;--border:#A07848;--border-light:#B8956A;--accent:#8B6020;--accent-red:#8B1A1A;--gold:#7A4F00;--text:#3A2008;--text-dim:#6B4A20;--cell-open:#E8D5B0;--cell-block:#B89060}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;margin:0}body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC',serif;display:flex;justify-content:center;align-items:center;padding:6px;position:relative}
body::after{content:" ";position:fixed;top:0;left:0;bottom:0;right:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");z-index:9999;background-size:200px 200px;pointer-events:none;opacity:0.06;mix-blend-mode:multiply}
.container{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#EAE2D2 0%,#E5DCC8 100%);padding:8px 10px 8px;position:relative;border-radius:18px 4px 22px 6px / 6px 20px 4px 24px;transform:rotate(-0.2deg);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -1px 3px rgba(0,0,0,0.04),4px 6px 12px rgba(0,0,0,0.15),0 0 0 10px rgba(179,163,132,0.15)}
.top-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px;flex-shrink:0}
.stat{background:var(--parchment-dark);border:1px solid var(--border);border-radius:5px;padding:5px 4px;text-align:center}
.stat .lbl{font-size:10px;color:var(--text-dim);font-family:sans-serif}
.stat .val{font-size:15px;font-weight:500;color:var(--text);line-height:1.2;font-family:'Cinzel',serif}
.stat .val.red{color:var(--accent-red)}
.stat .val.gold{color:var(--gold)}
.btn-row{display:flex;gap:6px;margin:4px 0;flex-shrink:0}
.btn{flex:1;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--parchment-dark);cursor:pointer;font-size:12px;color:var(--text);text-align:center;font-family:sans-serif}
.btn.primary{background:var(--accent);color:#F5E8D0;border-color:#6B4010}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.board-wrap{--fx:50%;--fy:50%;background:var(--parchment-dark);border:2px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;position:relative;z-index:2;perspective:1000px;overflow:hidden;flex:1;min-height:100px}
.board-wrap::after{content:'';position:absolute;inset:0;background:radial-gradient(circle 160px at var(--fx) var(--fy),transparent 35%,rgba(192,160,110,0.50) 65%,rgba(160,120,72,0.80) 100%);pointer-events:none;z-index:10;border-radius:6px}
.board-scroll{transform:rotateX(70deg);transform-style:preserve-3d}
.board-grid{display:grid;grid-template-columns:repeat(10,46px);gap:0;background:transparent;width:460px;margin:0 auto;justify-content:center;padding:12px 0}
.board-cell{width:46px;height:53px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;position:relative;font-size:10px;background:var(--cell-open);margin-top:-13px;margin-bottom:-13px;transform-style:preserve-3d;border:none;border-radius:0}
.board-cell.hex-offset{margin-left:23px;margin-right:-23px}
.board-cell.wall{background:var(--cell-block)}
.board-cell:not(.wall){box-shadow:0 4px 0 0 rgba(0,0,0,0.18)}
.board-cell.wall{box-shadow:0 8px 0 0 rgba(0,0,0,0.30)}
.board-cell.hero{background:transparent;box-shadow:none;filter:none}
.board-cell.enemy{background:transparent;box-shadow:none;filter:none}
.board-cell.swamp{background:#D0D8E8;filter:drop-shadow(0 0 0 1px #6090B0)}
.board-cell.fire{background:#FDE8C0;filter:drop-shadow(0 0 0 1px #E8A020)}
.board-cell.ink{background:#C0D8E8;filter:drop-shadow(0 0 0 1px #6090B0)}
.board-cell.in-range{background:#FFE8A0;filter:drop-shadow(0 0 6px rgba(200,150,40,0.7));cursor:pointer;animation:rangePulse 1.2s ease-in-out infinite;transition:background 0.1s,filter 0.1s}
.board-cell.in-range:hover{background:#FFD040;filter:drop-shadow(0 0 14px rgba(220,160,20,1))}
.board-cell.in-range.wall{background:var(--cell-block);filter:none;cursor:default;animation:none}
.board-cell.in-range.wall:hover{background:var(--cell-block);filter:none}
@keyframes rangePulse{0%,100%{filter:drop-shadow(0 0 6px rgba(200,150,40,0.7))}50%{filter:drop-shadow(0 0 10px rgba(220,180,60,0.9))}}
.board-cell.exit-zone{background:#C8F0D0;filter:drop-shadow(0 0 8px rgba(60,160,80,0.8));cursor:pointer;animation:exitPulse 0.8s ease-in-out infinite}
.board-cell.exit-zone.wall{background:var(--cell-block);filter:none;cursor:default;animation:none}
@keyframes exitPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(60,160,80,0.8))}50%{filter:drop-shadow(0 0 14px rgba(80,220,100,1))}}
.objective-bar{display:flex;gap:8px;margin-bottom:8px;font-size:11px;font-family:sans-serif;color:var(--text-dim);align-items:center;justify-content:center}
.objective-bar .obj{background:var(--parchment-dark);border:1px solid var(--border);border-radius:5px;padding:4px 10px;display:flex;align-items:center;gap:4px}
.objective-bar .obj.done{background:#C8D8C0;color:#3A5A20;text-decoration:line-through}
.victory-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s}
.victory-overlay.show{opacity:1;pointer-events:auto}
.victory-card{background:linear-gradient(180deg,#F5E8D0,#E5D8B0);border:3px solid var(--gold);border-radius:12px;padding:20px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.victory-card h2{font-family:'Cinzel',serif;color:var(--gold);font-size:24px;margin:0 0 8px}
.victory-card p{font-size:14px;color:var(--text);margin:4px 0}
.victory-card .btn{margin-top:12px}
.board-cell.wall{cursor:default}
.board-cell img{transition:transform 0.1s linear}
.board-cell .hp-bar{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:28px;height:4px;background:rgba(0,0,0,0.15);border-radius:2px;overflow:hidden;z-index:3}
.board-cell .hp-bar-fill{height:100%;background:var(--accent-red);border-radius:2px;transition:width 0.2s}
.sprite-layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;z-index:5}
.sprite-layer .sprite{position:absolute;transform-origin:bottom center;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.sprite-layer .sprite img{width:100%;height:100%;object-fit:contain;transition:transform 0.1s linear}
.board-toast{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(58,32,8,0.88);color:#F5E8D0;font-size:12px;font-family:sans-serif;padding:6px 14px;border-radius:6px;pointer-events:none;z-index:10;opacity:0;transition:opacity 0.2s}
.board-toast.show{opacity:1}
.board-cell.damage-flash{animation:damageFlash 0.2s ease-out}
@keyframes damageFlash{0%{background-color:rgba(255,80,80,0.65)}100%{background-color:transparent}}
@keyframes bombPop{0%{transform:scale(0.3);opacity:0}40%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0.9}}
.log{background:var(--parchment-dark);border:1px solid var(--border);border-radius:5px;padding:4px 6px;margin-top:4px;font-size:10px;color:var(--text);font-family:sans-serif;line-height:1.4;max-height:40px;overflow-y:auto;flex-shrink:0}
</style>
</head>
<body>
<div class="container">
<div class="top-bar"><div class="stat"><div class="lbl">❤️ HP</div><div class="val red" id="dHP">10/10</div></div><div class="stat"><div class="lbl">🛡️ 护甲</div><div class="val" id="dArmor">0</div></div><div class="stat"><div class="lbl">⚡ AP</div><div class="val gold" id="dAP">99</div></div><div class="stat"><div class="lbl">回合</div><div class="val" id="dRound">0</div></div></div>
<div class="objective-bar"><div class="obj" id="objBoss">👹 击杀石像鬼队长</div><div class="obj" id="objExit">🚩 抵达右端出口</div></div>
<div class="board-wrap"><div class="board-scroll" id="boardScroll"><div class="board-grid" id="boardGrid"></div><div class="sprite-layer" id="terrainLayer"></div><div class="sprite-layer char-layer" id="charLayer"></div></div><div class="board-toast" id="boardToast"></div></div>
<div class="btn-row"><button class="btn" id="btnEnd">结束回合</button><button class="btn primary" id="btnReset">重置</button></div>
<div class="log" id="boardLog"></div>
</div>
<div class="victory-overlay" id="victoryOverlay"><div class="victory-card"><h2>🏆 胜利！</h2><p id="victoryMsg"></p><button class="btn primary" id="btnVictory">再來一局</button></div></div>

<script>
(function(){
const ROWS=7,COLS=10,CELL_W=46,CELL_H=53,ROW_H=40,HEX_OFF=23,PAD_TOP=12,GRID_W=460;
const TERRAIN={NORMAL:0,SWAMP:1,FIRE:2,INK:3},VIEW_R=2;
function inView(r,c){return Math.abs(r-hero.r)<=VIEW_R&&Math.abs(c-hero.c)<=VIEW_R;}
const map=Array.from({length:ROWS},()=>Array(COLS).fill(1));
map[0][4]=map[0][8]=map[1][3]=map[1][7]=map[3][1]=0;map[4][5]=map[4][8]=map[5][2]=map[6][6]=0;
const terrain=Array.from({length:ROWS},()=>Array(COLS).fill(0));
terrain[1][2]=TERRAIN.SWAMP;terrain[1][6]=TERRAIN.FIRE;terrain[2][4]=TERRAIN.INK;terrain[3][5]=TERRAIN.FIRE;terrain[4][3]=TERRAIN.SWAMP;terrain[5][8]=TERRAIN.FIRE;terrain[6][2]=TERRAIN.INK;terrain[6][7]=TERRAIN.SWAMP;
const terrainUses=Array.from({length:ROWS},()=>Array(COLS).fill(0));
let hero={r:3,c:0,hp:10,maxHp:10,armor:0,facing:'right',imgIdle:'img/knight.png',imgMove:'img/knight_move.png',imgAtk:'img/knight_attack.png'};
let enemies=[{id:1,r:2,c:4,hp:3,maxHp:3,type:'藤蔓怪',icon:'🟢',img:'img/Slime.png',imgMove:'img/slime_move.png',imgAtk:'img/slime_attack.png',special:null,facing:'left'},{id:2,r:5,c:3,hp:4,maxHp:4,type:'恶魂',icon:'💀',img:'img/bone.png',imgMove:'img/bone_move.png',imgAtk:'img/bone_attack.png',imgDead:'img/bone_dead.png',imgBomb:'img/bone_bomb.png',special:'deathBoom',facing:'left'},{id:3,r:1,c:7,hp:5,maxHp:5,type:'吸血鬼',icon:'🔮',img:'img/witcher.png',imgMove:'img/witcher_move.png',imgAtk:'img/witcher_attack.png',special:'lifesteal',facing:'left'},{id:4,r:3,c:8,hp:12,maxHp:12,type:'石像鬼队长',icon:'👹',img:'img/gargoyle.jpg',imgMove:'img/gargoyle_move.png',imgAtk:'img/gargoyle_attack.png',special:'boss',armor:3,facing:'left'}];
let round=0,isAnimating=false,waitingForConfirm=false,prevHero=null,prevEnemies=[],isVictory=false,corpses=[];

function updUI(){document.getElementById('dHP').textContent=hero.hp+'/'+hero.maxHp;document.getElementById('dArmor').textContent=hero.armor;document.getElementById('dAP').textContent='99';document.getElementById('dRound').textContent=round}
function addLog(m){const d=document.createElement('div');d.textContent='· '+m;document.getElementById('boardLog').prepend(d);while(document.getElementById('boardLog').children.length>20)document.getElementById('boardLog').lastChild.remove()}
function clrLog(){document.getElementById('boardLog').innerHTML=''}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let tt=0;function toast(m){const el=document.getElementById('boardToast');clearTimeout(tt);el.textContent=m;el.classList.add('show');tt=setTimeout(()=>el.classList.remove('show'),1400)}
function bossAlive(){return enemies.some(e=>e.special==='boss'&&e.hp>0)}
function updateObjectiveUI(){const b=document.getElementById('objBoss'),x=document.getElementById('objExit');if(!bossAlive()){b.classList.add('done');b.textContent='✅ 石像鬼队长已击杀'}else{b.classList.remove('done');b.textContent='👹 击杀石像鬼队长'}if(hero.c===9&&!bossAlive()){x.classList.add('done');x.textContent='✅ 已抵达出口'}else{x.classList.remove('done');x.textContent='🚩 抵达右端出口'}}
function checkWin(){if(!isVictory&&hero.c===9&&!bossAlive()){isVictory=true;showVictory()}}
function showVictory(){const ov=document.getElementById('victoryOverlay');document.getElementById('victoryMsg').textContent=`${round} 回合通关 · 剩余 HP ${hero.hp}/${hero.maxHp}`;ov.classList.add('show');document.getElementById('btnEnd').disabled=true}

function getHexNeighbors(r,c){
  const odd=r%2===1;
  return [[r-1,c+(odd?0:-1)],[r-1,c+(odd?1:0)],[r,c-1],[r,c+1],[r+1,c+(odd?0:-1)],[r+1,c+(odd?1:0)]]
    .filter(([nr,nc])=>nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&map[nr]&&map[nr][nc]);
}
function isHexAdjacent(r1,c1,r2,c2){return getHexNeighbors(r1,c1).some(([nr,nc])=>nr===r2&&nc===c2)}

let cellCenters=[];
function buildCache(){
  const $scroll=document.getElementById('boardScroll'),layer=document.getElementById('charLayer');
  const pT=$scroll.style.transform,pS=$scroll.style.transition;
  $scroll.style.transition='none';$scroll.style.transform='none';$scroll.offsetHeight;
  const lr=layer.getBoundingClientRect();cellCenters=[];
  for(let r=0;r<ROWS;r++){cellCenters[r]=[];for(let c=0;c<COLS;c++){
    const cel=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if(!cel){cellCenters[r][c]={x:0,y:0};continue}
    const cr=cel.getBoundingClientRect();cellCenters[r][c]={x:cr.left-lr.left+cr.width/2,y:cr.top-lr.top+cr.height/2};
  }}
  $scroll.style.transform=pT;$scroll.style.transition=pS;
}
function getCP(r,c){return(cellCenters[r]&&cellCenters[r][c])||{x:0,y:0}}

function swapFrame(spriteEl,src){if(!spriteEl||!src)return;const im=spriteEl.querySelector('img');if(im)im.src=src}

function animateLunge(r,c,dr,dc,flip,atkSrc,idleSrc){return new Promise(resolve=>{
  const pos=getCP(r,c),sp=document.getElementById('charLayer').children;let img=null;
  for(const s of sp){if(Math.abs(parseFloat(s.style.left)-pos.x)<2&&Math.abs(parseFloat(s.style.top)-pos.y)<2){img=s.querySelector('img');break}}
  if(!img){resolve();return}
  if(atkSrc)img.src=atkSrc;
  const sf=flip==='right'?'scaleX(-1)':'scaleX(1)';
  img.style.transition='transform 0.12s ease-out';img.style.transform=`${sf} translate(${dc*50}%,0)`;
  setTimeout(()=>{img.style.transition='transform 0.12s ease-in';img.style.transform=`${sf} translate(0,0)`;setTimeout(()=>{img.style.transition='transform 0.15s linear';if(idleSrc)img.src=idleSrc;resolve()},120)},120);
})}
function flashDamage(r,c){return new Promise(resolve=>{
  const cel=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(!cel){resolve();return}
  cel.classList.add('damage-flash');setTimeout(()=>{cel.classList.remove('damage-flash');resolve()},200);
})}

function imgTag(src,facing){const flip=facing==='right'?'scaleX(-1)':'scaleX(1)';return`<img src="${src}" style="width:100%;height:100%;object-fit:contain;transform:${flip}" />`}
const ENEMY_Y_OFF={'藤蔓怪':-55,'恶魂':-95,'吸血鬼':-65,'石像鬼队长':-95};

function renderBoard(){
  prevHero={r:hero.r,c:hero.c};prevEnemies=enemies.filter(e=>e.hp>0).map(e=>({id:e.id,r:e.r,c:e.c}));
  const $grid=document.getElementById('boardGrid');$grid.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');cell.className='board-cell';
    if(r%2===1)cell.classList.add('hex-offset');
    cell.dataset.r=r;cell.dataset.c=c;cell.style.zIndex=r*10;
    if(!map[r][c]){cell.classList.add('wall')}else{
      const t=terrain[r][c],u=terrainUses[r][c],mx=t===TERRAIN.FIRE?2:t===TERRAIN.INK?1:Infinity;
      if(t&&u<mx){if(t===TERRAIN.SWAMP)cell.classList.add('swamp');if(t===TERRAIN.FIRE)cell.classList.add('fire');if(t===TERRAIN.INK)cell.classList.add('ink')}
      if(r===hero.r&&c===hero.c)cell.classList.add('hero');
      else if(enemies.some(e=>e.hp>0&&e.r===r&&e.c===c))cell.classList.add('enemy');
      if(c===9&&map[r][c]&&!(r===hero.r&&c===hero.c))cell.classList.add('exit-zone');
    }
    $grid.appendChild(cell);
  }
  getHexNeighbors(hero.r,hero.c).forEach(([nr,nc])=>{const ncell=document.querySelector(`[data-r="${nr}"][data-c="${nc}"]`);if(ncell)ncell.classList.add('in-range')});
  updateObjectiveUI();
  buildCache();
  $tL.innerHTML='';$cL.innerHTML='';
  function mkSpr(layer,r,c,w,h,html,anim,facing){
    const el=document.createElement('div');el.className='sprite';el.style.width=w+'px';el.style.height=h+'px';
    const p=getCP(r,c);el.style.left=p.x+'px';el.style.top=p.y+'px';
    el.style.transform='translate(-50%,-95%) rotateX(-70deg)';el.innerHTML=html;
    if(anim){const im=el.querySelector('img');if(im){im.style.transform=anim.from;requestAnimationFrame(()=>{
      const flip=facing==='right'?'scaleX(-1)':'scaleX(1)';im.style.transform=anim.to+' '+flip;
    })}}
    layer.appendChild(el);return el;
  }
  const $tL=document.getElementById('terrainLayer'),$cL=document.getElementById('charLayer');
  // 底层：地形 + 墙壁
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=terrain[r][c],u=terrainUses[r][c],mx=t===TERRAIN.FIRE?2:t===TERRAIN.INK?1:Infinity;
    if(!t||u>=mx)continue;let im='';if(t===TERRAIN.SWAMP)im='swamp.png';else if(t===TERRAIN.FIRE)im='fire.png';else if(t===TERRAIN.INK)im='ink.png';
    if(!im)continue;const tY={[TERRAIN.SWAMP]:-15,[TERRAIN.FIRE]:-45,[TERRAIN.INK]:-45}[t]||-45;const ts=mkSpr($tL,r,c,44,44,`<img src="img/${im}" style="width:100%;height:100%;object-fit:contain" />`,null,'left');ts.style.transform=`translate(-50%,${tY}%) rotateX(-70deg)`;if(t===TERRAIN.FIRE)ts.title='篝火 剩余'+(mx-u)+'次';}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(map[r][c])continue;
    const ws=mkSpr($tL,r,c,44,44,`<img src="img/block.png" style="width:100%;height:100%;object-fit:contain" />`,null,'left');ws.style.transform='translate(-50%,-45%) rotateX(-70deg)';
  }
  // 上层：英雄 + 敌人 + 尸体
  const hdr=prevHero?prevHero.r-hero.r:0,hdc=prevHero?prevHero.c-hero.c:0,hr=hero.hp/hero.maxHp,har=hero.armor/hero.maxHp;
  const hs=mkSpr($cL,hero.r,hero.c,42,48,`<div class="hp-bar">${hero.armor>0?`<div class="hp-bar-fill" style="width:${har*100}%;background:#7B9DB8"></div>`:''}<div class="hp-bar-fill" style="width:${hr*100}%;background:#4A7A3A"></div></div>${imgTag(hero.imgIdle,hero.facing)}`,hdr||hdc?{from:`translate(${hdc*100}%,${hdr*100}%)`,to:'translate(0,0)'}:null,hero.facing);
  hs.style.flexDirection='column';hs.title=hero.hp+'/'+hero.maxHp;
  hs.style.transform='translate(-50%,-65%) rotateX(-70deg)';
  enemies.forEach(en=>{
    if(en.hp<=0)return;
    const pr=prevEnemies.find(p=>p.id===en.id),edr=pr?pr.r-en.r:0,edc=pr?pr.c-en.c:0;
    const ratio=en.hp/en.maxHp,ear=(en.armor||0)/en.maxHp,yPct=ENEMY_Y_OFF[en.type]!==undefined?ENEMY_Y_OFF[en.type]:-95;
    const es=mkSpr($cL,en.r,en.c,38,44,`<div class="hp-bar">${en.armor>0?`<div class="hp-bar-fill" style="width:${ear*100}%;background:#7B9DB8"></div>`:''}<div class="hp-bar-fill" style="width:${ratio*100}%"></div></div>${imgTag(en.img,en.facing)}`,edr||edc?{from:`translate(${edc*100}%,${edr*100}%)`,to:'translate(0,0)'}:null,en.facing);
    es.style.flexDirection='column';es.style.transform=`translate(-50%,${yPct}%) rotateX(-70deg)`;es.title=en.hp+'/'+en.maxHp;
  });
  corpses.forEach(co=>{const cs=mkSpr($cL,co.r,co.c,38,44,`<img src="${co.imgDead}" style="width:100%;height:100%;object-fit:contain" />`,null,'left');cs.style.transform='translate(-50%,-95%) rotateX(-70deg)';cs.title='不稳定的尸体'});
  const $sc=document.getElementById('boardScroll'),vpW=$sc.parentElement.clientWidth,vpH=$sc.parentElement.clientHeight,p=getCP(hero.r,hero.c);
  $sc.style.transform=`translate(${vpW*0.5-p.x}px,${vpH*0.55-p.y}px) rotateX(70deg)`;
  updUI();
  updateFocusMask();
}

function updateFocusMask(){
  const wrap=document.querySelector('.board-wrap');
  const cell=document.querySelector(`[data-r="${hero.r}"][data-c="${hero.c}"]`);
  if(!cell)return;
  const wr=wrap.getBoundingClientRect(),cr=cell.getBoundingClientRect();
  const cx=cr.left+cr.width/2-wr.left,cy=cr.top+cr.height/2-wr.top;
  wrap.style.setProperty('--fx',(cx/wr.width*100)+'%');
  wrap.style.setProperty('--fy',(cy/wr.height*100)+'%');
}

async function moveHero(dr,dc){
  if(isAnimating||hero.hp<=0)return;const nr=hero.r+dr,nc=hero.c+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS||!map[nr][nc])return;
  if(enemies.some(e=>e.hp>0&&e.r===nr&&e.c===nc))return;
  isAnimating=true;
  const nx=getCP(nr,nc).x,ox=getCP(hero.r,hero.c).x;if(nx>ox)hero.facing='right';else if(nx<ox)hero.facing='left';
  const oldP=getCP(hero.r,hero.c),newP=getCP(nr,nc);let hspr=null;
  for(const s of document.getElementById('charLayer').children){if(Math.abs(parseFloat(s.style.left)-oldP.x)<2&&Math.abs(parseFloat(s.style.top)-oldP.y)<2){hspr=s;break}}
  // 先翻转朝向 + 换移动帧，再移动
  if(hspr){const im=hspr.querySelector('img');if(im){im.style.transform='scaleX('+(hero.facing==='right'?-1:1)+')';im.src=hero.imgMove;}}
  if(hspr){hspr.style.transition='left 0.28s ease-out, top 0.28s ease-out';hspr.style.left=newP.x+'px';hspr.style.top=newP.y+'px';await sleep(280);hspr.style.transition=''}
  hero.r=nr;hero.c=nc;addLog(`移动至 (${nr},${nc})`);renderBoard();await sleep(150);
  if(terrain[nr][nc]===TERRAIN.INK&&terrainUses[nr][nc]<1){terrainUses[nr][nc]++;addLog('🕳️ 陷入墨水池！')}
  if(nc===9&&bossAlive()){toast('⚠️ 必须先击杀石像鬼队长！')}
  checkWin();
  isAnimating=false;
}

async function heroAtk(target){
  if(isAnimating||hero.hp<=0)return;const t=target||enemies.find(e=>e.hp>0&&isHexAdjacent(hero.r,hero.c,e.r,e.c));if(!t)return;
  // 攻击时面向目标：先翻转图片，再攻击
  const tx=getCP(t.r,t.c).x,hx3=getCP(hero.r,hero.c).x;if(tx>hx3)hero.facing='right';else if(tx<hx3)hero.facing='left';
  isAnimating=true;
  await animateLunge(hero.r,hero.c,t.r-hero.r,t.c-hero.c,hero.facing,hero.imgAtk,hero.imgIdle);
  let dmg=2;if(t.armor>0){const b=Math.min(t.armor,dmg);t.armor-=b;dmg-=b;if(b>0)addLog(`🛡️${t.type}护甲抵挡${b}点`)}
  if(dmg>0){t.hp-=dmg;addLog(`⚔️攻击${t.type}，造成${dmg}伤害`)}
  if(t.hp<=0){addLog(`${t.icon}${t.type}被击杀！`);if(t.special==='deathBoom'){corpses.push({r:t.r,c:t.c,imgDead:t.imgDead,imgBomb:t.imgBomb,type:t.type,icon:t.icon});addLog(`💀 ${t.type}倒下，留下了一具不稳定的尸体…`)}}
  await flashDamage(t.r,t.c);
  // 怪物反击（远程免反击）
  if(t.hp>0&&t.special!=='ranged'){
    const hx4=getCP(hero.r,hero.c).x,ex4=getCP(t.r,t.c).x;if(hx4>ex4)t.facing='right';else if(hx4<ex4)t.facing='left';
    await animateLunge(t.r,t.c,hero.r-t.r,hero.c-t.c,t.facing,t.imgAtk,t.img);
    let cdmg=1;if(hero.armor>0){const b=Math.min(hero.armor,cdmg);hero.armor-=b;cdmg-=b;if(b>0)addLog(`🛡️护甲减${b}`)}
    if(cdmg>0){hero.hp-=cdmg;addLog(`⚔️${t.type}反击，造成${cdmg}伤害`)}
    await flashDamage(hero.r,hero.c);
  }
  renderBoard();if(hero.hp<=0)addLog('💀 英雄阵亡！');checkWin();isAnimating=false;
}

async function enemyTurn(){
  const log=[],hpB=hero.hp;
  for(const e of enemies){if(e.hp<=0)continue;
    const oR=e.r,oC=e.c,dr=Math.sign(hero.r-e.r),dc=Math.sign(hero.c-e.c);let nr=e.r,nc=e.c;if(dr)nr=e.r+dr;else if(dc)nc=e.c+dc;
    const bl=(nr===hero.r&&nc===hero.c)||!map[nr][nc]||enemies.some(o=>o!==e&&o.hp>0&&o.r===nr&&o.c===nc);
    if(!bl&&nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
      const nx2=getCP(nr,nc).x,ox2=getCP(oR,oC).x;if(nx2>ox2)e.facing='right';else if(nx2<ox2)e.facing='left';
      const oldP=getCP(oR,oC),newP=getCP(nr,nc);let espr=null;
      for(const s of document.getElementById('charLayer').children){if(Math.abs(parseFloat(s.style.left)-oldP.x)<2&&Math.abs(parseFloat(s.style.top)-oldP.y)<2){espr=s;break}}
      if(espr){const im=espr.querySelector('img');if(im){im.style.transform='scaleX('+(e.facing==='right'?-1:1)+')';if(e.imgMove)im.src=e.imgMove;}}
      if(espr){espr.style.transition='left 0.28s ease-out, top 0.28s ease-out';espr.style.left=newP.x+'px';espr.style.top=newP.y+'px';await sleep(280);espr.style.transition=''}
      e.r=nr;e.c=nc;log.push(`👾${e.type} (${oR},${oC})→(${e.r},${e.c})`);renderBoard();await sleep(180);
    }
    if(isHexAdjacent(hero.r,hero.c,e.r,e.c)){const hx2=getCP(hero.r,hero.c).x,ex2=getCP(e.r,e.c).x;if(hx2>ex2)e.facing='right';else if(hx2<ex2)e.facing='left';await animateLunge(e.r,e.c,hero.r-e.r,hero.c-e.c,e.facing,e.imgAtk,e.img);
      let dmg=e.special==='boss'?2:1;if(hero.armor>0){const b=Math.min(hero.armor,dmg);hero.armor-=b;dmg-=b;log.push('🛡️护甲减'+b)}
      if(dmg>0){hero.hp-=dmg;log.push(`⚔️${e.type}攻击，造成${dmg}伤害`);if(e.special==='lifesteal'&&e.hp<e.maxHp){e.hp=Math.min(e.maxHp,e.hp+1);log.push('🩸吸血鬼吸取生命，回复1HP')}}await flashDamage(hero.r,hero.c);}await sleep(250);
  }if(hero.hp<hpB)log.push(`❤️英雄受伤${hpB-hero.hp}(剩${hero.hp}/${hero.maxHp})`);
  // 尸体爆炸
  if(corpses.length>0){renderBoard();await sleep(200);
    for(const co of[...corpses]){const $sp=document.getElementById('charLayer'),pos=getCP(co.r,co.c);
      const bEl=document.createElement('div');bEl.className='sprite';bEl.style.cssText=`position:absolute;left:${pos.x}px;top:${pos.y}px;width:52px;height:52px;transform:translate(-50%,-95%) rotateX(-70deg);z-index:50;`;
      bEl.innerHTML=`<img src="${co.imgBomb}" style="width:100%;height:100%;object-fit:contain;animation:bombPop 0.4s ease-out" />`;$sp.appendChild(bEl);await sleep(100);
      if(isHexAdjacent(hero.r,hero.c,co.r,co.c)){let bd=1;if(hero.armor>0){const bl=Math.min(hero.armor,bd);hero.armor-=bl;bd-=bl;if(bl>0)log.push(`🛡️护甲抵挡${bl}点爆炸`)}if(bd>0){hero.hp-=bd;log.push(`💥尸体爆炸，造成${bd}伤害`)}await flashDamage(hero.r,hero.c)}
      else log.push('💥尸体爆炸（未波及英雄）');
      bEl.remove();corpses=corpses.filter(c=>c!==co);}renderBoard();}
  if(!log.length)log.push('敌人没有行动');return log;
}

async function endRound(){if(isAnimating||waitingForConfirm||isVictory)return;isAnimating=true;const log=await enemyTurn();renderBoard();
  if(hero.hp<=0){log.forEach(m=>addLog(m));isAnimating=false;return}log.forEach(m=>addLog(m));addLog('👾 点击「确认」继续');
  waitingForConfirm=true;document.getElementById('btnEnd').textContent='确认 · 下一回合';document.getElementById('btnEnd').disabled=false;isAnimating=false;}
function confirmRound(){waitingForConfirm=false;round++;document.getElementById('btnEnd').textContent='结束回合';document.getElementById('btnEnd').disabled=false;addLog(`── 第${round}回合 ──`);renderBoard();}
function disableAll(){['btnEnd'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true})}
function resetDebug(){hero={r:3,c:0,hp:10,maxHp:10,armor:0,facing:'right',imgIdle:'img/knight.png',imgMove:'img/knight_move.png',imgAtk:'img/knight_attack.png'};enemies=[{id:1,r:2,c:4,hp:3,maxHp:3,type:'藤蔓怪',icon:'🟢',img:'img/Slime.png',imgMove:'img/slime_move.png',imgAtk:'img/slime_attack.png',special:null,facing:'left'},{id:2,r:5,c:3,hp:4,maxHp:4,type:'恶魂',icon:'💀',img:'img/bone.png',imgMove:'img/bone_move.png',imgAtk:'img/bone_attack.png',imgDead:'img/bone_dead.png',imgBomb:'img/bone_bomb.png',special:'deathBoom',facing:'left'},{id:3,r:1,c:7,hp:5,maxHp:5,type:'吸血鬼',icon:'🔮',img:'img/witcher.png',imgMove:'img/witcher_move.png',imgAtk:'img/witcher_attack.png',special:'lifesteal',facing:'left'},{id:4,r:3,c:8,hp:12,maxHp:12,type:'石像鬼队长',icon:'👹',img:'img/gargoyle.jpg',imgMove:'img/gargoyle_move.png',imgAtk:'img/gargoyle_attack.png',special:'boss',armor:3,facing:'left'}];for(let r=0;r<ROWS;r++)terrainUses[r].fill(0);round=0;isAnimating=false;waitingForConfirm=false;prevHero=null;prevEnemies=[];isVictory=false;corpses=[];document.getElementById('victoryOverlay').classList.remove('show');document.getElementById('btnEnd').textContent='结束回合';document.getElementById('btnEnd').disabled=false;clrLog();renderBoard();}

document.getElementById('boardGrid').addEventListener('click',async e=>{
  if(isAnimating||waitingForConfirm||hero.hp<=0||isVictory)return;const cell=e.target.closest('.board-cell');if(!cell)return;
  const tr=parseInt(cell.dataset.r),tc=parseInt(cell.dataset.c);if(isNaN(tr)||isNaN(tc))return;
  if(!isHexAdjacent(hero.r,hero.c,tr,tc))return;
  const clickedEnemy=enemies.find(e=>e.hp>0&&e.r===tr&&e.c===tc);if(clickedEnemy){await heroAtk(clickedEnemy);return}
  if(map[tr][tc]){await moveHero(tr-hero.r,tc-hero.c);return}
});
document.getElementById('btnEnd').addEventListener('click',async()=>{if(isVictory)return;if(waitingForConfirm)confirmRound();else await endRound()});
document.getElementById('btnReset').addEventListener('click',resetDebug);
document.getElementById('btnVictory').addEventListener('click',resetDebug);
renderBoard();
})();
</script>
</body></html>
